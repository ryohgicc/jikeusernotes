<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>即刻私人备注</title>
<style>
body { width: 280px; padding: 16px; font: 14px/1.6 system-ui, sans-serif; color: #222; }
h1 { font-size: 18px; margin: 0; } h2 { font-size: 15px; margin: 18px 0 8px; } p { color: #666; }
button, label { display: block; width: 100%; box-sizing: border-box; margin: 8px 0;
padding: 8px; border: 1px solid #ddd; border-radius: 8px; background: #fff;
font: inherit; text-align: center; cursor: pointer; }
input { margin-top: 8px; width: 100%; } #status { overflow-wrap: anywhere; }
.toggle { display: flex; gap: 10px; text-align: left; align-items: center; }
.toggle input { margin: 0; width: auto; flex-shrink: 0; }
.age-setting { display: flex; gap: 8px; align-items: center; text-align: left; cursor: default; }
.age-setting input { width: 70px; margin: 0; padding: 4px; font: inherit; }
input:disabled { cursor: not-allowed; }
</style></head><body>
<h1>即刻私人备注</h1>
<h2>阅读位置</h2>
<label class="toggle"><input id="restore-reading" type="checkbox" disabled>自动记录并恢复阅读位置</label>
<label class="toggle"><input id="reading-expiry" type="checkbox" disabled>限制阅读记录有效期</label>
<label class="age-setting" for="reading-max-age">超过 <input id="reading-max-age" type="number" min="1" max="365" step="1" value="7" required disabled> 天不自动恢复</label>
<p>从上次记录时间起计算，每天为 24 小时，可设 1～365 天。关闭有效期限制后，记录长期有效。</p>
<label class="toggle"><input id="reading-notice" type="checkbox" disabled>显示恢复结果与撤销提示</label>
<p>支持首页动态、发现、个人主页动态。主动滚动会停止恢复；查找期间可随时取消。</p>
<button id="clear-reading" type="button" disabled>清除阅读位置</button>
<p id="reading-status" role="status"></p>
<h2>私人备注</h2>
<p>在即刻网页版点击昵称后的「+ 备注」。已有备注可点击修改。</p>
<p id="count"></p>
<button id="export" type="button">导出备注备份</button>
<label for="import">导入备份（合并，同一用户以导入为准）<input id="import" type="file" accept="application/json,.json"></label>
<p id="status" role="status"></p>
<p>数据仅保存在本机，不随账号同步。卸载扩展前请先导出。</p>
<script src="popup.js"></script></body></html>
